services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linguastruct
      POSTGRES_PASSWORD: linguastruct
      POSTGRES_DB: linguastruct
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://linguastruct:linguastruct@db:5432/linguastruct
      SECRET_KEY: change-me-in-production-please-use-long-random-string
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      - db
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
